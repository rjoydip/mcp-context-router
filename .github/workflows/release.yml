name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - name: Install Vite+
        shell: bash
        run: |
          curl -fsSL https://vite.plus | bash
          echo "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"
      - run: vp install
      - run: vp check
      - run: vp test --coverage
      - run: vp build
      - name: Package source
        run: tar -czf mcp-context-router-${GITHUB_REF_NAME}.tar.gz --exclude=node_modules --exclude=coverage --exclude=playwright-report .
      - uses: softprops/action-gh-release@v2
        with:
          files: mcp-context-router-${{ github.ref_name }}.tar.gz
